<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Nguyễn Quang Huy - PTIT</title>
  <!-- Nhúng React, ReactDOM và Babel để trình duyệt hiểu cú pháp JSX khi Go Live -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #f0f2f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- type="text/babel" giúp chạy React JSX trực tiếp trên Live Server -->
  <script type="text/babel">
    const styles = {
      container: {
        maxWidth: '750px',
        margin: '30px auto',
        padding: '30px',
        backgroundColor: '#ffffff',
        boxShadow: '0 4px 16px rgba(0,0,0,0.08)',
        borderRadius: '8px',
        color: '#333',
        lineHeight: '1.6',
      },
      header: {
        borderBottom: '2px solid #e0e0e0',
        paddingBottom: '20px',
        marginBottom: '20px',
        textAlign: 'center',
      },
      name: {
        margin: '0 0 6px 0',
        color: '#c0392b',
        fontSize: '28px',
        textTransform: 'uppercase',
        letterSpacing: '1px',
      },
      subtitle: {
        margin: '0 0 8px 0',
        fontSize: '15px',
        fontWeight: 'bold',
        color: '#555',
      },
      contactInfo: {
        fontSize: '13px',
        color: '#777',
        marginBottom: '10px',
      },
      bio: {
        fontSize: '14px',
        fontStyle: 'italic',
        color: '#444',
        maxWidth: '600px',
        margin: '0 auto',
      },
      section: {
        marginBottom: '24px',
      },
      sectionTitle: {
        fontSize: '18px',
        color: '#c0392b',
        borderBottom: '1px solid #c0392b',
        paddingBottom: '4px',
        marginBottom: '12px',
        textTransform: 'uppercase',
      },
      sectionContent: {
        fontSize: '14px',
      },
      skillsContainer: {
        display: 'flex',
        flexDirection: 'column',
        gap: '8px',
      },
      projectList: {
        display: 'flex',
        flexDirection: 'column',
        gap: '16px',
      },
      projectCard: {
        backgroundColor: '#f9f9f9',
        padding: '12px 16px',
        borderRadius: '6px',
        borderLeft: '4px solid #c0392b',
      },
      projectHeader: {
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'baseline',
      },
      projectName: {
        margin: '0 0 4px 0',
        fontSize: '15px',
        color: '#222',
      },
      projectPeriod: {
        fontSize: '12px',
        color: '#888',
      },
      projectDesc: {
        margin: '4px 0',
        fontSize: '13.5px',
        color: '#555',
      },
      projectTech: {
        margin: '4px 0 0 0',
        fontSize: '13px',
        color: '#444',
      },
    };

    // 1. Component Section dùng children
    function Section({ title, children }) {
      return (
        <section style={styles.section}>
          <h2 style={styles.sectionTitle}>{title}</h2>
          <div style={styles.sectionContent}>{children}</div>
        </section>
      );
    }

    // 2. Component Header
    function Header({ name, dob, school, major, bio }) {
      return (
        <header style={styles.header}>
          <h1 style={styles.name}>{name}</h1>
          <p style={styles.subtitle}>
            Sinh viên năm 2 - {school} | Chuyên ngành: {major}
          </p>
          <div style={styles.contactInfo}>
            <span>🎂 Ngày sinh: {dob}</span> | 
            <span> 📍 Hà Nội, Việt Nam</span> | 
            <span> ✉️ huy.nguyen@ptit.edu.vn</span>
          </div>
          <p style={styles.bio}>{bio}</p>
        </header>
      );
    }

    // 3. Component Skills nhận mảng qua props
    function Skills({ skills }) {
      return (
        <div style={styles.skillsContainer}>
          {skills.map((item, index) => (
            <div key={index}>
              <strong>{item.category}: </strong>
              <span>{item.items.join(', ')}</span>
            </div>
          ))}
        </div>
      );
    }

    // 4. Component Projects nhận mảng qua props
    function Projects({ projects }) {
      return (
        <div style={styles.projectList}>
          {projects.map((proj, index) => (
            <div key={index} style={styles.projectCard}>
              <div style={styles.projectHeader}>
                <h3 style={styles.projectName}>{proj.name}</h3>
                <span style={styles.projectPeriod}>{proj.period}</span>
              </div>
              <p style={styles.projectDesc}>{proj.description}</p>
              <p style={styles.projectTech}>
                <strong>Công nghệ:</strong> {proj.techStack.join(', ')}
              </p>
            </div>
          ))}
        </div>
      );
    }

    // Component tổng hợp
    function CVApp() {
      const skillsData = [
        {
          category: 'Phần cứng & Vi điều khiển',
          items: ['ESP32', 'Arduino', 'Raspberry Pi', 'C/C++ nhúng', 'Giao thức MQTT / HTTP'],
        },
        {
          category: 'AI & Data',
          items: ['Python', 'OpenCV', 'TensorFlow Lite', 'YOLO for Edge Devices'],
        },
        {
          category: 'Web & Công cụ',
          items: ['React.js', 'Node.js', 'Git / GitHub', 'KiCad'],
        },
      ];

      const projectsData = [
        {
          name: 'Hệ thống giám sát môi trường thông minh (Smart Garden IoT)',
          period: '12/2025 - 03/2026',
          description:
            'Thu thập dữ liệu cảm biến qua ESP32, truyền dữ liệu bằng MQTT lên server và điều khiển bơm tưới tự động.',
          techStack: ['ESP32', 'C++', 'MQTT', 'Node.js', 'React Dashboard'],
        },
        {
          name: 'Hệ thống nhận diện khuôn mặt Edge AI',
          period: '04/2026 - Hiện tại',
          description:
            'Nhận diện khuôn mặt thời gian thực sử dụng Raspberry Pi và camera để tự động ghi nhận điểm danh.',
          techStack: ['Python', 'OpenCV', 'Raspberry Pi', 'SQLite'],
        },
      ];

      return (
        <div style={styles.container}>
          <Header
            name="NGUYỄN QUANG HUY"
            dob="08/06/2007"
            school="Học viện Công nghệ Bưu chính Viễn thông (PTIT)"
            major="AIoT (Trí tuệ nhân tạo và Vạn vật kết nối)"
            bio="Sinh viên năm 2 ngành AIoT đam mê lập trình phần cứng nhúng kết hợp các giải pháp trí tuệ nhân tạo."
          />

          <Section title="Học Vấn">
            <p><strong>Học viện Công nghệ Bưu chính Viễn thông (PTIT)</strong> (2025 - Hiện tại)</p>
            <p>Ngành: Trí tuệ nhân tạo & Vạn vật kết nối (AIoT) - Sinh viên năm 2</p>
          </Section>

          <Section title="Kỹ Năng">
            <Skills skills={skillsData} />
          </Section>

          <Section title="Dự Án Tiêu Biểu">
            <Projects projects={projectsData} />
          </Section>
        </div>
      );
    }

    // Render ra màn hình
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CVApp />);
  </script>
</body>
</html>
